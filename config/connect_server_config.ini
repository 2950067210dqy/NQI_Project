[server]
url = http://47.116.17.195:8000/
;url = http://localhost:8000/
timeout = 30
; 单个 HTTP 请求最多尝试次数（包含首次请求），最小值为 1。
request_retry_count = 3
; 首次自动连接使用短轮询探测，成功后自动恢复上面的30秒长轮询。
initial_poll_timeout = 1
poll_interval = 5
device_status_poll_interval = 5
device_status_timeout = 5

[download]
download_dir = ./downloads
auto_download = false

[notification]
show_popup = true
play_sound = false

[display]
auto_refresh_interval = 10
max_display_files = 1000

[filter]
show_excel_only = false
show_image_only = false
device_id_filter =
